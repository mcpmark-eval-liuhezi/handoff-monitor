<name: Handoff Summary\n\non:\n  workflow_dispatch:\n    branches: [main]\n\njobs:\n  handoff:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Write handoff log\n        run: |\n          echo "Handoff run executed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > handoff-log.txt\n          echo "Repository: mcpmark-eval-liuhezi/handoff-monitor" >> handoff-log.txt\n          echo "Purpose: Release duty handover evidence for teammate onboarding." >> handoff-log.txt\n          echo "Status: CI checks are operational." >> handoff-log.txt\n          cat handoff-log.txt\n      - name: Upload handoff summary artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: handoff-summary\n          path: handoff-log.txt\n----------